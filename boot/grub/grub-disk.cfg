# GRUB config for a b1nix system installed on a disk (whole-disk image / the
# /sbin/b1nix-install target). Unlike the live ISO config, there is no
# `module2 rootfs.img` — the root filesystem IS this partition, mounted by the
# kernel via root= (kernel/main.c find_root_device). @CMDLINE@ carries root=sda1.
insmod all_video
insmod gfxterm
insmod part_msdos
insmod ext2

set timeout=@TIMEOUT@
set default=0

set gfxmode=1280x800x32,1280x800,auto
set gfxpayload=keep

menuentry "b1nix (@ARCH@)" {
    multiboot2 /boot/kernel.elf @CMDLINE@
    boot
}

menuentry "b1nix (@ARCH@, text mode, no graphics)" {
    multiboot2 /boot/kernel.elf @CMDLINE@ b1nix.nographics
    boot
}

menuentry "b1nix (@ARCH@, single-user / emergency shell)" {
    multiboot2 /boot/kernel.elf @CMDLINE@ b1nix.single
    boot
}
