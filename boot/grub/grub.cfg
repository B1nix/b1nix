set timeout=@TIMEOUT@
set default=0

menuentry "b1nix" {
    multiboot2 /boot/kernel.elf @CMDLINE@
    boot
}

menuentry "b1nix (single-user / emergency shell)" {
    multiboot2 /boot/kernel.elf @CMDLINE@ b1nix.single
    boot
}

menuentry "b1nix (text mode, no graphics)" {
    multiboot2 /boot/kernel.elf @CMDLINE@ b1nix.nographics
    boot
}
