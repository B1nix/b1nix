# Load every available video backend so a framebuffer can be set on real
# hardware: VBE on legacy BIOS, GOP on UEFI (plus efi_uga/efi_gop). Without this
# a UEFI boot often lands in text mode and the kernel's Multiboot2 framebuffer
# request goes unsatisfied.
insmod all_video
insmod gfxterm

set timeout=@TIMEOUT@
set default=0

# Ask GRUB to set a graphics mode matching the kernel's Multiboot2 framebuffer
# tag (1024x768x32), falling back to any 1024x768 or whatever the firmware
# offers. gfxpayload=keep hands that exact mode straight to the kernel instead
# of dropping back to VGA text, so b1nix gets a real linear framebuffer on the
# metal (BIOS VBE or UEFI GOP) — the same path QEMU already exercises.
set gfxmode=1024x768x32,1024x768,auto
set gfxpayload=keep

menuentry "b1nix (@ARCH@)" {
    multiboot2 /boot/kernel.elf @CMDLINE@
    @MODULE_CMD@
    boot
}

menuentry "b1nix (@ARCH@, single-user / emergency shell)" {
    multiboot2 /boot/kernel.elf @CMDLINE@ b1nix.single
    @MODULE_CMD@
    boot
}

menuentry "b1nix (@ARCH@, text mode, no graphics)" {
    multiboot2 /boot/kernel.elf @CMDLINE@ b1nix.nographics
    @MODULE_CMD@
    boot
}

menuentry "b1nix (@ARCH@, mount root from USB flash drive)" {
    multiboot2 /boot/kernel.elf @CMDLINE@ root=LABEL=b1nix-root b1nix.xhci.run
    boot
}
