# ═══════════════════════════════════════════════════════════════════════════
#  M109 — the storage- and device-side applets, unblocked by real kernel work.
#
#  chattr/lsattr   FS_IOC_GETFLAGS/FS_IOC_SETFLAGS over the ext2 i_flags byte;
#                  immutable and append-only are enforced in the VFS write,
#                  truncate, rename and unlink paths (kernel/fs/vfs.c,
#                  kernel/fs/ext4.c).
#  blkdiscard      BLKDISCARD/BLKZEROOUT down to the device's own command —
#                  virtio-blk DISCARD, NVMe DSM Deallocate, ATA TRIM. A device
#                  without one reports EOPNOTSUPP rather than pretending
#                  (kernel/dev/blk.c and the three drivers).
#  fstrim          FITRIM walks a mounted ext4's free block bitmaps and offers
#                  each free run to the device (kernel/fs/ext4.c).
#  ionice          ioprio_set/ioprio_get; the block layer's admission gate
#                  hands a busy device to the best-priority waiter, with
#                  ageing so no class can starve another (kernel/dev/blk.c).
#  setserial       TIOCGSERIAL over the real 16550 — port, IRQ, clock and
#                  divisor. TIOCSSERIAL refuses: a legacy COM port's address
#                  and IRQ are fixed by the platform (kernel/dev/serial_tty.c).
# ═══════════════════════════════════════════════════════════════════════════

chattr    = upstream
lsattr    = upstream
blkdiscard= upstream
fstrim    = upstream
ionice    = upstream
setserial = upstream
