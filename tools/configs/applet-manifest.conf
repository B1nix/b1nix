# ═══════════════════════════════════════════════════════════════════════════
#  Already compiled into the BusyBox multicall ELF, just never symlinked.
#
#  The binary carries 194 applets; only ~67 had a /bin entry, so the rest were
#  dead weight the image paid for and could not use. Notably `sed` was missing
#  entirely — enough to break most configure scripts and any ported init/build
#  script. Exposing these costs nothing: one symlink each, no new code.
#
#  Deliberately NOT listed: ash (/bin/sh and /bin/ash are wired up separately),
#  init (BusyBox init is PID 1, but the kernel reaches it as /sbin/init — the
#  Alpine layout — not through a /bin entry; see M108 and /etc/inittab), and
#  fdisk, which still needs partition-table ioctls b1nix does
#  not expose — a dangling command that fails at runtime is worse than no
#  command.
#
#  M108 handover, second half: the dedicated ELFs that duplicated an applet are
#  gone — chmod, chown, id, whoami, groups, halt, setfattr and meminfo now come
#  from the multicall ELF, and userspace/bin holds test programs and the
#  b1nix-specific tools (bpkg, b1nix_install, telinit, the GUI apps) only.
#
#  The account tools moved to BusyBox's own names: adduser/deluser/addgroup/
#  delgroup. There is no useradd/userdel/groupadd applet to point those names at,
#  and a symlink from a shadow-suite name to an applet that rejects its options
#  would be a rename rather than a handover — so those three names simply do not
#  exist any more, exactly as on a stock BusyBox system.
#
#  M108: su/passwd/login ARE listed, but userspace/Makefile points their /bin
#  symlinks at /opt/busybox/bin/busybox-suid (mode 4755 root) instead of the
#  plain multicall ELF — they are the three BB_SUID_REQUIRE applets and need
#  euid 0 for /etc/shadow. Everything else keeps the non-setuid copy.
# ═══════════════════════════════════════════════════════════════════════════

# ═══════════════════════════════════════════════════════════════════════════
#  M107 — unblocked by real kernel subsystems, not by lowering the bar.
#
#  ip/route/arp/netstat  AF_NETLINK + NETLINK_ROUTE over the real interface,
#                        FIB and ARP tables (kernel/net/netlink.c).
#  chvt/openvt/deallocvt virtual terminals with the VT_* ioctls, and
#  setfont/loadkmap/     PIO_FONT/KDFONTOP plus a live keysym table
#  dumpkmap              (kernel/dev/vt.c).
#  losetup               loop_info64, offsets and a write path
#                        (kernel/dev/loop.c).
#  lsof/fuser/pmap       /proc/<pid>/fd symlinks that carry the full path and
#                        maps with [heap]/[stack] (kernel/fs/procfs.c).
#  syslogd/klogd/logread /dev/kmsg, /proc/kmsg and syslog(2)
#                        (kernel/dev/kmsg.c).
#  inotifyd              IN_MOVED_FROM/TO with cookies, IN_ATTRIB,
#                        IN_DELETE_SELF (kernel/fs/inotify.c).
#  hwclock/rtcwake       /dev/rtc0 with RTC_RD_TIME/RTC_SET_TIME/RTC_WKALM_*
#                        (kernel/dev/rtc_dev.c).
#  watchdog              /dev/watchdog with the WDIOC_* interface and a real
#                        reset deadline (kernel/dev/watchdog.c).
#  i2c*                  /dev/i2c-0 on the PIIX4/ICH9 SMBus host controller;
#                        the node only exists when the controller does
#                        (kernel/dev/i2c.c). i2ctransfer needs raw-I2C
#                        messages an SMBus controller cannot issue and will
#                        report that rather than misbehave.
# ═══════════════════════════════════════════════════════════════════════════

# Network administration (netlink)
ip        = upstream
route     = upstream
arp       = upstream
arping    = upstream
netstat   = upstream

# Virtual terminals, console fonts and keymaps
chvt      = upstream
openvt    = upstream
deallocvt = upstream
setfont   = upstream
loadkmap  = upstream
dumpkmap  = upstream

# Loop devices
losetup   = upstream

# Loadable kernel modules (M95/M96). These drive the real init_module(2) /
# finit_module(2) / delete_module(2) syscalls; /lib/modules/<uname -r> holds
# the .ko images and the depmod-format modules.dep / modules.alias that
# modprobe, modinfo and the kernel's own request_module() all read.
insmod    = upstream
rmmod     = upstream
lsmod     = upstream
modprobe  = upstream
modinfo   = upstream
depmod    = upstream

# Namespaces (M109): the kernel side is unshare(2)/setns(2) and
# /proc/<pid>/ns/*, which the namespace tests already exercise. These two are
# the ordinary way a person uses them from a shell.
nsenter   = upstream
unshare   = upstream

# Layers built for them (M114): each of these needs a kernel subsystem that did
# not exist, and each is listed only because that subsystem now does.
#   readahead    readahead(2), a real prefetch into the cache
#   setconsole   TIOCCONS, kernel console redirected to a terminal
#   raidautorun  software RAID (kernel/dev/md.c), assembled by RAID_AUTORUN
#   nbd-client   network block device over the existing TCP stack
#   eject,volname  the ATAPI packet read path, so a CD-ROM is a block device
#   flash_eraseall,flashcp  MTD over CFI NOR flash (kernel/dev/mtd.c), which
#                  QEMU provides through -drive if=pflash. The NAND-only tools
#                  (nanddump, nandwrite) stay unbuilt: they exist for
#                  out-of-band data, and NOR has none.
readahead = upstream
setconsole = upstream
raidautorun = upstream
nbd-client = upstream
eject     = upstream
volname   = upstream
flash_eraseall = upstream
flashcp   = upstream

