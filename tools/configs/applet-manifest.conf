# Applet source-selection manifest for /bin replacement.
#
# Each non-blank, non-comment line:  <command> = <source>
#   source = native   — use the kernel built-in busybox dispatch
#   source = upstream — create /bin/<command> → /opt/busybox/bin/busybox symlink
#
# Commands with source=upstream are "retired" from the native dispatch table
# when B1NIX_UPSTREAM_BUSYBOX=1; their /bin entry is served by the upstream
# BusyBox multicall ELF instead.  This is the incremental retirement described
# in docs/roadmap.md M42 items 3 and 4.
#
# Change a line from upstream → native to revert to the built-in handler at
# build time without touching any source code.

# ═══════════════════════════════════════════════════════════════════════════
#  Commands verified through BusyBox upstream smoke tests (BB-W1..BB-W9)
#  and switched to the upstream multicall ELF.
# ═══════════════════════════════════════════════════════════════════════════

# File/directory
pwd       = upstream
ls        = upstream
cp        = upstream
mv        = upstream
rm        = upstream
mkdir     = upstream
mkfifo    = upstream
wget      = upstream
setsid    = upstream
mknod     = upstream
rmdir     = upstream
ln        = upstream
readlink  = upstream
touch     = upstream
basename  = upstream
dirname   = upstream
chmod     = upstream
chown     = upstream

# System
ps        = upstream
top       = upstream
free      = upstream
kill      = upstream
date      = upstream
uname     = upstream
vmstat    = upstream
id        = upstream
whoami    = upstream
uuidgen   = upstream

# Text
cat       = upstream
echo      = upstream
printf    = upstream
head      = upstream
tail      = upstream
grep      = upstream
find      = upstream
wc        = upstream
sort      = upstream
uniq      = upstream
tree      = upstream
tsort     = upstream
sha384sum = upstream

# Filesystem
mount     = upstream
df        = upstream
sync      = upstream
hexdump   = upstream
lsblk     = upstream

# Network
ifconfig  = upstream
ping      = upstream

# Diagnostics
dmesg     = upstream

# Misc
true      = upstream
false     = upstream
test      = upstream
[         = upstream
yes       = upstream
sleep     = upstream
clear     = upstream
login     = upstream
getty     = upstream

# ═══════════════════════════════════════════════════════════════════════════
#  Commands that stay on the native busybox dispatch — no upstream BusyBox
#  equivalent in the current configuration, or genuinely b1nix-specific.
# ═══════════════════════════════════════════════════════════════════════════

sysctl    = upstream
nc        = upstream

# ═══════════════════════════════════════════════════════════════════════════
#  Already compiled into the BusyBox multicall ELF, just never symlinked.
#
#  The binary carries 194 applets; only ~67 had a /bin entry, so the rest were
#  dead weight the image paid for and could not use. Notably `sed` was missing
#  entirely — enough to break most configure scripts and any ported init/build
#  script. Exposing these costs nothing: one symlink each, no new code.
#
#  Deliberately NOT listed: ash (/bin/sh and /bin/ash are wired up separately),
#  init (BusyBox init is PID 1 only when the kernel cmdline selects it, so it
#  is reached as /opt/busybox/bin/init, not through a /bin entry — see M108 and
#  /etc/inittab), and ip/route/fdisk/losetup/lsof, which need netlink,
#  partition ioctls or a fuller /proc than b1nix currently exposes — a dangling
#  command that fails at runtime is worse than no command.
#
#  M108: su/passwd/login ARE listed below, but userspace/Makefile points their
#  /bin symlinks at /opt/busybox/bin/busybox-suid (mode 4755 root) instead of
#  the plain multicall ELF — they are the three BB_SUID_REQUIRE applets and
#  need euid 0 for /etc/shadow. Everything else keeps the non-setuid copy.
# ═══════════════════════════════════════════════════════════════════════════

# Account management — served by the setuid copy (see note above)
su        = upstream
passwd    = upstream

# Text processing — the gap that mattered most
sed       = upstream
awk       = upstream
cut       = upstream
tr        = upstream
xargs     = upstream
diff      = upstream
cmp       = upstream

# Environment / paths
env       = upstream
printenv  = upstream
realpath  = upstream
mktemp    = upstream
which     = upstream
seq       = upstream
tee       = upstream

# Files / filesystems
stat      = upstream
du        = upstream
dd        = upstream
umount    = upstream
getfattr  = upstream

# Archives — needed to consume anything shipped as a tarball
tar       = upstream
gzip      = upstream
gunzip    = upstream
zcat      = upstream
bzip2     = upstream
bunzip2   = upstream
bzcat     = upstream
xzcat     = upstream
unxz      = upstream

# Checksums
md5sum    = upstream
sha256sum = upstream
cksum     = upstream

# Processes / misc
pidof     = upstream
pgrep     = upstream
pkill     = upstream
uptime    = upstream
nslookup  = upstream

# Newly compiled in (see busybox-1.38.0.config): pure-userspace applets that
# were only missing because allnoconfig never selected them.
expr      = upstream
