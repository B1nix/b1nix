# Applet source-selection manifest for /bin replacement.
#
# Each non-blank, non-comment line:  <command> = <source>
#   source = native   — use the kernel built-in busybox dispatch
#   source = upstream — create /bin/<command> → /opt/busybox/bin/busybox symlink
#
# Commands with source=upstream are "retired" from the native dispatch table
# when B1NIX_UPSTREAM_BUSYBOX=1; their /bin entry is served by the upstream
# BusyBox multicall ELF instead.  This is the incremental retirement described
# in docs/roadmap.md M42 items 3 and 4.
#
# Change a line from upstream → native to revert to the built-in handler at
# build time without touching any source code.

# ═══════════════════════════════════════════════════════════════════════════
#  Commands verified through BusyBox upstream smoke tests (BB-W1..BB-W9)
#  and switched to the upstream multicall ELF.
# ═══════════════════════════════════════════════════════════════════════════

