# ==============================================================================
# b1nix Raspberry Pi 4 HIL Test Stand Configuration
# ==============================================================================

# TFTP root directory where the Pi 4 fetches kernel and firmware over network (PXE)
TFTP_ROOT="/srv/tftp/rpi4"

# Serial port device for UART console (leave empty for automatic detection)
# Examples:
#   macOS: SERIAL_PORT="/dev/cu.usbserial-0001"
#   Linux: SERIAL_PORT="/dev/ttyUSB0"
SERIAL_PORT=""

# Serial Baud Rate (115200 8N1)
BAUD_RATE=115200

# Maximum test execution timeout in seconds
TIMEOUT=120

# Optional Webhook URL to send JSON test report and full log
# Example: WEBHOOK_URL="https://your-server.com/api/rpi4-results"
WEBHOOK_URL=""

# Kernel command line arguments passed via cmdline.txt over TFTP
KERNEL_CMDLINE="console=ttyAMA0,115200 b1nix.test=1 init=/bin/m12_smoke"
