# Applet source-selection manifest for /bin replacement.
#
# Each non-blank, non-comment line:  <command> = <source>
#   source = native   — use the kernel built-in busybox dispatch
#   source = upstream — create /bin/<command> → /opt/busybox/bin/busybox symlink
#
# Commands with source=upstream are "retired" from the native dispatch table
# when B1NIX_UPSTREAM_BUSYBOX=1; their /bin entry is served by the upstream
# BusyBox multicall ELF instead.  This is the incremental retirement described
# in docs/roadmap.md M42 items 3 and 4.
#
# Change a line from upstream → native to revert to the built-in handler at
# build time without touching any source code.

# ═══════════════════════════════════════════════════════════════════════════
#  Commands verified through BusyBox upstream smoke tests (BB-W1..BB-W6)
#  and switched to the upstream multicall ELF.
# ═══════════════════════════════════════════════════════════════════════════

# File/directory
pwd       = upstream
ls        = upstream
cp        = upstream
mv        = upstream
rm        = upstream
mkdir     = upstream
rmdir     = upstream
ln        = upstream
readlink  = upstream
touch     = upstream
basename  = upstream
dirname   = upstream

# System
ps        = upstream
top       = upstream
free      = upstream
kill      = upstream
date      = upstream
uname     = upstream

# Text
cat       = upstream
echo      = upstream
printf    = upstream
head      = upstream
tail      = upstream
grep      = upstream
find      = upstream
wc        = upstream
sort      = upstream
uniq      = upstream

# Filesystem
mount     = upstream
df        = upstream
sync      = upstream
hexdump   = upstream
lsblk     = upstream

# Network
ifconfig  = upstream
ping      = upstream

# Diagnostics
dmesg     = upstream

# Misc
true      = upstream
false     = upstream
test      = upstream
[         = upstream
yes       = upstream
sleep     = upstream
clear     = upstream
login     = upstream

# ═══════════════════════════════════════════════════════════════════════════
#  Commands that stay on the native busybox dispatch — no upstream BusyBox
#  equivalent in the current configuration, or genuinely b1nix-specific.
# ═══════════════════════════════════════════════════════════════════════════

sysctl    = native
nc        = native
reboot    = native
poweroff  = native
halt      = native
shutdown  = native
