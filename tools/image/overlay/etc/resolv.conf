nameserver 10.0.2.3
# QEMU usernet's built-in DNS forwarder. musl's defaults are timeout:5
# attempts:2 per server, i.e. up to ten seconds of waiting before a lookup is
# declared dead — and in a VM with no path off-link that wait is pure dead time
# in every test that resolves a name. The sys lane spent ~3 minutes of its ~10
# sitting on one such lookup (curl -> example.com), long enough to trip the
# guest silence watchdog three times.
#
# One second, one attempt: when the forwarder is reachable it answers in
# microseconds, so nothing is lost; when it is not, the probe fails fast and
# the test reports "unsupported" instead of stalling the lane.
options timeout:1 attempts:1
