# bpkg configuration. Sourced as POSIX sh by /bin/bpkg.
#
# INDEX_URL: where 'bpkg update' fetches the package index from. Supports
# file://, http:// and https:// (curl + libcurl/mbedTLS handle TLS).
#
# To install real packages: push pkgs/ to the PUBLIC repo B1nix/b1nix-pkgs
# (see tools/packages/bpkg-publish.sh), then uncomment the jsDelivr line below.
#INDEX_URL=https://cdn.jsdelivr.net/gh/B1nix/b1nix-pkgs@main/pkgs/index

# Smoke/offline default: the index fixture pre-staged in the image.
INDEX_URL=file:///pkgs/index
