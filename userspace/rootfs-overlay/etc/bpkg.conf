# bpkg configuration, read by /bin/bpkg (one KEY=VALUE per line).
#
# INDEX_URL: where 'bpkg update' fetches package indexes from. Supports
# file://, http:// and https:// (bpkg links mbedTLS and verifies the server
# certificate against /etc/ssl/certs/ca-certificates.crt).
#
# Several repositories may be listed, separated by spaces — Alpine splits its
# packages across main/ and community/, and dependency resolution needs both in
# one set. Each repository is cached separately under /var/lib/bpkg/.
#
# Real Alpine v3.20 mirrors (musl 1.2.5, the same libc b1nix builds — their
# x86_64 binaries are ABI-compatible with this system):
#INDEX_URL=https://dl-cdn.alpinelinux.org/alpine/v3.20/main/x86_64/APKINDEX.tar.gz https://dl-cdn.alpinelinux.org/alpine/v3.20/community/x86_64/APKINDEX.tar.gz

# The house repository (flat format, see tools/packages/bpkg-publish.sh):
#INDEX_URL=https://cdn.jsdelivr.net/gh/B1nix/b1nix-pkgs@main/pkgs/index

# Smoke/offline default: the index fixture pre-staged in the image.
INDEX_URL=file:///pkgs/index
