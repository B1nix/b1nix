# The live root is the installed root: the medium's seed image, as the live
# session sees it, copied file by file. What only makes sense on a live medium
# is left behind here or removed by packages.conf.
---
unpack:
    - source: "/"
      sourcefs: "file"
      destination: ""
      exclude:
        - "/boot/*"
        - "/dev/*"
        - "/proc/*"
        - "/sys/*"
        - "/run/*"
        - "/tmp/*"
        - "/mnt/*"
        - "/media/*"
        - "/var/tmp/*"
        - "/swapfile"
        - "/.snapshots"
