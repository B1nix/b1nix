# The disk layout of an installed b1nix:
#
#   BIOS boot   1 MiB on a BIOS machine (Calamares adds it for GPT)
#   /boot       512 MiB FAT32, typed as an EFI system partition: Limine and the
#               kernels live here, and Limine reads FAT on BIOS and UEFI alike
#   /           the rest; btrfs by default with @, @home and @snapshots
#               (mount.conf), ext4 offered
---
efiSystemPartition: "/boot"
efiSystemPartitionSize: 512MiB
efiSystemPartitionName: B1NIX-ESP
defaultPartitionTableType: gpt
requiredPartitionTableType: gpt
userSwapChoices:
    - none
    - file
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
initialPartitioningChoice: erase
defaultFileSystemType: "btrfs"
availableFileSystemTypes: ["btrfs", "ext4"]
# Encryption needs device-mapper and dm-crypt in the kernel, which b1nix does
# not have yet (docs/kernel/abi-gaps.md). Offering it would end in a machine
# that cannot open its own root.
enableLuksAutomatedPartitioning: false
partitionLayout:
    - name: "B1NIX-ESP"
      filesystem: "fat32"
      mountPoint: "/boot"
      size: 512MiB
      type: "c12a7328-f81f-11d2-ba4b-00a0c93ec93b"
    - name: "b1nix-root"
      filesystem: "unknown"
      mountPoint: "/"
      size: 100%
