# What Calamares' bootloader module would do, done the b1nix way: the kernel
# onto the ESP, its initramfs, Limine's boot entries and the BIOS stages, then
# snapper for the root. Runs outside the target, with the target's root as its
# argument.
---
dontChroot: true
timeout: 900
script:
    - command: "/usr/lib/b1nix/installer/b1nix-install-target ${ROOT}"
      timeout: 900
