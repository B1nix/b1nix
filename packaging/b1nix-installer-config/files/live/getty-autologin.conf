# The live session logs straight in as root: there is nothing on the medium
# to protect, and a person trying b1nix should not need a password for it.
# Shipped by b1nix-installer-config, so the installed system, which no longer
# has the package, asks for one again.
[Service]
ExecStart=
ExecStart=-/sbin/agetty --autologin root --noclear --keep-baud %I 115200,38400,9600 $TERM
